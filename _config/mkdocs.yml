# Documentation site on the shared MkDocs platform: theme, plugin and toolchain come from the
# kokeb-mkdocs-theme package in kokeb-labs/ci-tools. This file lives in _config/ with the other
# tool configuration; the pages are in ../docs. From the repository root:
#
#   pip install "git+https://github.com/kokeb-labs/ci-tools@v1\
#   #subdirectory=packages/kokeb-mkdocs-theme"      (one line, without the backslash)
#   mkdocs serve -f _config/mkdocs.yml               http://127.0.0.1:8000
#   mkdocs build -f _config/mkdocs.yml --strict      what CI runs
#   kokeb-docs figures && kokeb-docs gen         refresh figures and generated regions
#   kokeb-docs check                               what CI checks before the build
#
# kokeb-docs finds this file on its own. Pages: docs/, order: docs/.nav.yml, rules:
# docs/DOCS-STYLE-GUIDE.md in kokeb-labs/ci-tools.
site_name: AT25040B Driver
site_description: >-
  C++20 driver for the Microchip AT25010B, AT25020B and AT25040B SPI serial EEPROMs.
repo_url: https://github.com/kokeb-labs-drivers/driver-at25040b
copyright: Copyright (c) 2026 The driver-at25040b authors
docs_dir: ../docs
site_dir: ../site

theme:
  name: kokeb

plugins:
  - kokeb
  - search
  - awesome-nav
