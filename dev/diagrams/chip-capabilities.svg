<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="943" viewBox="0 0 1200 943" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the AT25040B does</title>
<desc id="chip-capabilities-desc">Capability map of the AT25040B: Sequential read (supported): Reads one byte or the whole array in one transfer; the address counter rolls over at the top; Page write (supported): Writes up to an 8-byte page in one self-timed cycle, split at page boundaries, no erase first; Status register (supported): Reads ready/busy, the write enable latch and the block protection bits; Block write protection (supported): Makes the top quarter, the top half or all of the array read-only, kept without power; Write protect and latch (supported): Blocks writes with the WP pin and the write enable latch; the driver releases WP only while it writes; Three densities (supported): One driver for the 128, 256 and 512 byte parts; the AT25040B carries address bit A8 in the opcode; SPI modes 0 and 3 (supported): Publishes the mode, bit order and clock and select timing for each supply voltage; HOLD pin (not covered): Pauses a transfer while SCK is low; the driver never uses it, tie the pin to VCC.</desc>
