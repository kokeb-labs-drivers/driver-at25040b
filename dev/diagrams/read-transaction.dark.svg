<text x="184.4" y="229.7" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">opcode</text>
<text x="312.9" y="197.5" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">byte address</text>
<text x="473.5" y="229.7" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">data out</text>
<text x="32" y="278" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">CS</text>
<text x="32" y="326" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SI</text>
<text x="184.4" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">0000 A011</text>
<text x="312.9" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">A7 to A0</text>
<text x="32" y="374" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SO</text>
<text x="441.4" y="373.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">byte n</text>
<text x="537.8" y="373.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">n+1</text>
<text x="46" y="441.1" font-size="17" font-weight="700" fill="#E2E8F0">Notes</text>
<text x="46" y="461.4" font-size="15" fill="#E2E8F0">Each field is 8 SCK cycles, MSB first. In the opcode 0000 A011, A is</text>
<text x="46" y="483.2" font-size="15" fill="#E2E8F0">address bit A8 on the AT25040B. The address counts up after each byte</text>
<text x="46" y="504.9" font-size="15" fill="#E2E8F0">and rolls over from the last address to the first while CS is low.</text>
</svg>
