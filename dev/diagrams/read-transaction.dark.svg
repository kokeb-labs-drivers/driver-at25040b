<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">READ instruction</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: 7 Timing Diagrams, Figures 7-1 to 7-8, p. 10; 6 Functional</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Description, Table 6-1, p. 8; 6 Functional Description, Read Sequence</text>
<text x="32" y="146.2" font-size="15" fill="#9AA6B5">(READ), p. 9.</text>
