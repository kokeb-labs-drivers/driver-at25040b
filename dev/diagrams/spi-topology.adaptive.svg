<text x="52" y="215.1" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="242.8" font-size="15" class="fk-f-ink2">SPI master, one select line per</text>
<text x="52" y="264.6" font-size="15" class="fk-f-ink2">device</text>
<text x="52" y="329.1" font-size="17" font-weight="700" class="fk-f-teal-text">AT25040B</text>
<text x="52" y="356.8" font-size="15" class="fk-f-ink2">CS from SS0</text>
<text x="52" y="421.1" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="448.8" font-size="15" class="fk-f-ink2">CS from SS1 and SS2</text>
<text x="52" y="513.1" font-size="17" font-weight="700" class="fk-f-teal-text">AT25040B</text>
<text x="52" y="540.8" font-size="15" class="fk-f-ink2">CS from SS3</text>
<text x="390.5" y="186.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">SCK</text>
