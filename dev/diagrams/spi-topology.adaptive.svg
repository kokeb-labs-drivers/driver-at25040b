<text x="477.5" y="186.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">SI (MOSI)</text>
<circle cx="477.5" cy="212.6" r="3.6" class="fk-f-ink2"/>
<circle cx="477.5" cy="326.6" r="3.6" class="fk-f-ink2"/>
