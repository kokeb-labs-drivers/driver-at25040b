<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Several AT25040B on one SPI bus</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: 5 Serial Interface Description, Figure 5-1, p. 7; 5 Serial Interface</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">Description, p. 6.</text>
