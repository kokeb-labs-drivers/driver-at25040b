<text x="46" y="609.1" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="629.5" font-size="15" class="fk-f-slate-text">Each device has its own chip select; SCK, SI and SO are shared (5, p. 7).</text>
<text x="46" y="651.2" font-size="15" class="fk-f-slate-text">A device whose CS is high ignores SI and keeps SO in high impedance</text>
<text x="46" y="673" font-size="15" class="fk-f-slate-text">(5, p. 6).</text>
