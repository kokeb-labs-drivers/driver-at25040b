<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="spi-topology-title spi-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="spi-topology-title">Several AT25040B on one SPI bus</title>
<desc id="spi-topology-desc">An SPI bus on which a microcontroller and several AT25040B share SCK, SI and SO, each device selected by its own chip select line from the host.</desc>
<rect x="0.5" y="0.5" width="639" height="719" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Several AT25040B on one SPI bus</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: 5 Serial Interface Description, Figure 5-1, p. 7; 5 Serial Interface</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Description, p. 6.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#252F3C"/>
