title: Several AT25040B on one SPI bus
kicker: Several devices
alt: >-
  An SPI bus on which a microcontroller and several AT25040B share SCK, SI and SO, each device selected by its own
  chip select line from the host.
reads: >-
  The MCU on top and the AT25040B devices under it connect to the rails SCK, SI and SO on the right; the dashed card
  stands for the devices in between. Each AT25040B has its own CS from the MCU, and an unselected device ignores SI
  and keeps SO in high impedance.
