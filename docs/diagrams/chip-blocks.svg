<text x="136" y="162.8" font-size="13" font-weight="700" fill="#334155">AT25040B</text>
<text x="221.8" y="162.8" font-size="12" fill="#334155">SOIC-8</text>
<text x="180" y="228.6" font-size="15" font-weight="700" fill="#8A3C0B">Status register</text>
<text x="180" y="253.4" font-size="13" fill="#2B3442">RDY, WEN, BP1, BP0</text>
<text x="180" y="348.6" font-size="15" font-weight="700" fill="#0B5F59">Memory array</text>
<text x="180" y="373.4" font-size="13" fill="#2B3442">128, 256 or 512 x 8 bits</text>
<text x="676" y="348.6" font-size="15" font-weight="700" fill="#7A360E">Address decoder</text>
<text x="676" y="373.4" font-size="13" fill="#2B3442">address byte, A8 in the opcode</text>
<text x="180" y="468.6" font-size="15" font-weight="700" fill="#7A360E">Data register</text>
<text x="180" y="493.4" font-size="13" fill="#2B3442">shifts SI in, MSB first</text>
<text x="676" y="468.6" font-size="15" font-weight="700" fill="#7A360E">Output buffer</text>
<text x="676" y="493.4" font-size="13" fill="#2B3442">drives SO, high impedance when idle</text>
<text x="180" y="588.5" font-size="15" font-weight="700" fill="#1E429F">Mode decode logic</text>
<text x="180" y="613.4" font-size="13" fill="#2B3442">opcode, CS and WP</text>
<text x="180" y="708.5" font-size="15" font-weight="700" fill="#334155">Clock generator</text>
<text x="180" y="733.4" font-size="13" fill="#2B3442">SCK, paused by HOLD</text>
<text x="106" y="350.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">VCC  8</text>
<text x="106" y="374.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">GND  4</text>
<text x="106" y="478.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">SI  5</text>
<text x="106" y="590.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">CS  1</text>
<text x="106" y="614.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">WP  3</text>
