<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="chip-frame-memory-title chip-frame-memory-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-memory-title">AT25040B: READ and WRITE instruction</title>
<desc id="chip-frame-memory-desc">READ and WRITE instruction of the AT25040B, 24 bits, most significant bit first. READ: 0000 (bits 23 to 20), A8 (bit 19), 011 (bits 18 to 16), address A7 to A0 (bits 15 to 8), any value (ignored) (bits 7 to 0); Data out: high impedance (bits 23 to 8), data D7 to D0 (bits 7 to 0); WRITE: 0000 (bits 23 to 20), A8 (bit 19), 010 (bits 18 to 16), address A7 to A0 (bits 15 to 8), data D7 to D0 (bits 7 to 0). Below, the SPI mode 0 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="751" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">AT25040B: READ and WRITE instruction</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Each instruction is one CS-low transfer: the opcode with address bit A8 (AT25040B), the address byte, then the data byte,</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">shown here for one byte. 24 bits, sent most significant bit first. Datasheet: 6 Functional Description, Table 6-1, p. 8.</text>
