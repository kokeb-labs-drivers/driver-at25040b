<text x="1138" y="451.5" font-size="16" text-anchor="end" fill="#566070">0</text>
<text x="32" y="502.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CS</text>
<text x="32" y="548.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SCK</text>
