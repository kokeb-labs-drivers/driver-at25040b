<text x="210" y="191.5" font-size="16" fill="#566070">MSB, sent first</text>
<text x="1140" y="191.5" font-size="16" text-anchor="end" fill="#566070">LSB, sent last</text>
<text x="32" y="230.5" font-size="20" font-weight="700" fill="#0E1726">RDSR</text>
<text x="32" y="250.5" font-size="16" fill="#566070">SI, 0000 X101</text>
<text x="442.5" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#1E429F">0000 X101</text>
<text x="212" y="275.5" font-size="16" fill="#566070">15</text>
<text x="673" y="275.5" font-size="16" text-anchor="end" fill="#566070">8</text>
<text x="907.5" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#334155">any value (ignored)</text>
