<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="892" viewBox="0 0 1200 892" role="img" aria-labelledby="chip-frame-status-title chip-frame-status-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-status-title">AT25040B: RDSR and WRSR instruction</title>
<desc id="chip-frame-status-desc">RDSR and WRSR instruction of the AT25040B, 16 bits, most significant bit first. RDSR: 0000 X101 (bits 15 to 8), any value (ignored) (bits 7 to 0); Status: high impedance (bits 15 to 8), status register (bits 7 to 0); WRSR: 0000 X001 (bits 15 to 8), status register (BP1 and BP0 in bits 3 and 2) (bits 7 to 0). The status register field of the Status row: bit 7 X7, bit 6 X6, bit 5 X5, bit 4 X4, bit 3 BP1, bit 2 BP0, bit 1 WEN, bit 0 RDY. Below, the SPI mode 0 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="891" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">AT25040B: RDSR and WRSR instruction</text>
<text x="32" y="115.4" font-size="18" fill="#566070">The status register moves in one 16-bit transfer; an RDSR reply of all ones means a write cycle is running. 16 bits, sent most</text>
<text x="32" y="141.5" font-size="18" fill="#566070">significant bit first. Datasheet: 6 Functional Description, Tables 6-2 and 6-3, p. 8.</text>
