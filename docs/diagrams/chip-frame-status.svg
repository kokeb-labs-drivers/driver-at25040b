<text x="32" y="338.5" font-size="16" fill="#566070">SO, after RDSR</text>
<text x="442.5" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#334155">high impedance</text>
<text x="212" y="363.5" font-size="16" fill="#566070">15</text>
<text x="673" y="363.5" font-size="16" text-anchor="end" fill="#566070">8</text>
