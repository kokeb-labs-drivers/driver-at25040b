<text x="32" y="640.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SO</text>
<text x="442.5" y="640.3" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">Hi-Z</text>
<text x="907.5" y="640.3" font-size="16" font-weight="600" text-anchor="middle" fill="#5B21B6">STATUS</text>
<text x="32" y="682.3" font-size="16" fill="#566070">SPI mode 0: SCK idles low; the chip samples its input on the rising edge and changes its output after the falling edge. CS stays low for the</text>
<text x="32" y="705.5" font-size="16" fill="#566070">whole frame.</text>
<text x="32" y="748.9" font-size="20" font-weight="700" fill="#0E1726">status register, one flag per bit (datasheet 6, p. 8)</text>
