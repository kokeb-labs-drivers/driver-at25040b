<text x="573" y="667.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R1 10 kΩ</text>
<text x="50" y="746.5" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="770" font-size="17" fill="#9F1239">+3V3: HOLD, VCC; also U2.VDD · GND: GND; also U2.GND</text>
<text x="50" y="839.5" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="863" font-size="17" fill="#334155">Support parts: 1 capacitor, 1 resistor around the supplies (values in the full schematic).</text>
<text x="32" y="909" font-size="16" fill="#566070">* Not confirmed in the datasheet: C1: decoupling value: the datasheet gives no VCC decoupling; R1: board choice that keeps WP low (writes</text>
<text x="32" y="932" font-size="16" fill="#566070">blocked) until the MCU drives it; the datasheet shows no WP circuit.</text>
