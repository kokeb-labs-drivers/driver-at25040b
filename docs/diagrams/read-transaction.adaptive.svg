<svg xmlns="http://www.w3.org/2000/svg" width="640" height="552" viewBox="0 0 640 552" role="img" aria-labelledby="read-transaction-title read-transaction-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="read-transaction-title">READ instruction</title>
<desc id="read-transaction-desc">One READ instruction of the AT25040B: CS low, the opcode with address bit A8, the low address byte on SI, then data bytes on SO from that address onwards until CS rises.</desc>
