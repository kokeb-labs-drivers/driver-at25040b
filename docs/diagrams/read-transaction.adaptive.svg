<text x="184.4" y="325.6" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">0000 A011</text>
<text x="312.9" y="325.6" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">A7 to A0</text>
<text x="32" y="374" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">SO</text>
<text x="441.4" y="373.6" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">byte n</text>
<text x="537.8" y="373.6" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">n+1</text>
<text x="46" y="441.1" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="461.4" font-size="15" class="fk-f-slate-text">Each field is 8 SCK cycles, MSB first. In the opcode 0000 A011, A is</text>
<text x="46" y="483.2" font-size="15" class="fk-f-slate-text">address bit A8 on the AT25040B. The address counts up after each byte</text>
<text x="46" y="504.9" font-size="15" class="fk-f-slate-text">and rolls over from the last address to the first while CS is low.</text>
