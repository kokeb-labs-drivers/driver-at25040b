<text x="184.4" y="229.7" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-slate-text">opcode</text>
<text x="312.9" y="197.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-slate-text">byte address</text>
<text x="473.5" y="229.7" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-slate-text">data out</text>
<text x="32" y="278" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">CS</text>
