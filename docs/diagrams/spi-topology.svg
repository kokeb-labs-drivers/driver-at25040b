<text x="52" y="215.1" font-size="17" font-weight="700" fill="#1E429F">MCU</text>
<text x="52" y="242.8" font-size="15" fill="#2B3442">SPI master, one select line per</text>
<text x="52" y="264.6" font-size="15" fill="#2B3442">device</text>
<text x="52" y="329.1" font-size="17" font-weight="700" fill="#0B5F59">AT25040B</text>
<text x="52" y="356.8" font-size="15" fill="#2B3442">CS from SS0</text>
<text x="52" y="421.1" font-size="17" font-weight="700" fill="#0E1726">…</text>
<text x="52" y="448.8" font-size="15" fill="#2B3442">CS from SS1 and SS2</text>
<text x="52" y="513.1" font-size="17" font-weight="700" fill="#0B5F59">AT25040B</text>
<text x="52" y="540.8" font-size="15" fill="#2B3442">CS from SS3</text>
<text x="390.5" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">SCK</text>
<circle cx="390.5" cy="202.6" r="3.6" fill="#2B3442"/>
<circle cx="390.5" cy="316.6" r="3.6" fill="#2B3442"/>
<circle cx="390.5" cy="408.6" r="3.6" fill="#2B3442"/>
<circle cx="390.5" cy="500.6" r="3.6" fill="#2B3442"/>
<text x="477.5" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">SI (MOSI)</text>
<circle cx="477.5" cy="212.6" r="3.6" fill="#2B3442"/>
<circle cx="477.5" cy="326.6" r="3.6" fill="#2B3442"/>
<circle cx="477.5" cy="418.6" r="3.6" fill="#2B3442"/>
<circle cx="477.5" cy="510.6" r="3.6" fill="#2B3442"/>
<text x="564.5" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">SO (MISO)</text>
<circle cx="564.5" cy="222.6" r="3.6" fill="#2B3442"/>
<circle cx="564.5" cy="336.6" r="3.6" fill="#2B3442"/>
<circle cx="564.5" cy="428.6" r="3.6" fill="#2B3442"/>
<circle cx="564.5" cy="520.6" r="3.6" fill="#2B3442"/>
<text x="46" y="609.1" font-size="17" font-weight="700" fill="#334155">Limits</text>
<text x="46" y="629.5" font-size="15" fill="#334155">Each device has its own chip select; SCK, SI and SO are shared (5, p. 7).</text>
<text x="46" y="651.2" font-size="15" fill="#334155">A device whose CS is high ignores SI and keeps SO in high impedance</text>
<text x="46" y="673" font-size="15" fill="#334155">(5, p. 6).</text>
</svg>
