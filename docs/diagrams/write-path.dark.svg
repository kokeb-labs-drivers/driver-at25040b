<text x="82" y="164.6" font-size="15" font-weight="700" fill="#E2E8F0">Check the range</text>
<text x="82" y="189.4" font-size="13" fill="#D2DAE4">Inside the variant's array, length at least 1</text>
<text x="82" y="263.6" font-size="15" font-weight="700" fill="#E2E8F0">Read the status until idle</text>
<text x="82" y="288.4" font-size="13" fill="#D2DAE4">Confirmed by a second read; waits out a running cycle</text>
<text x="82" y="362.6" font-size="15" font-weight="700" fill="#E2E8F0">Refuse a protected range</text>
<text x="82" y="387.4" font-size="13" fill="#D2DAE4">From BP1:BP0 (Table 6-4); nothing else is sent</text>
<text x="82" y="461.6" font-size="15" font-weight="700" fill="#E2E8F0">Release WP</text>
<text x="82" y="486.4" font-size="13" fill="#D2DAE4">GpioSet(WriteProtect, INACTIVE), when the port has it</text>
<text x="82" y="623" font-size="15" font-weight="700" fill="#A7F3E6">WREN, then read the status</text>
<text x="82" y="647.8" font-size="13" fill="#D2DAE4">WEN must read 1</text>
<text x="82" y="722" font-size="15" font-weight="700" fill="#A7F3E6">WRITE</text>
<text x="82" y="746.8" font-size="13" fill="#D2DAE4">Opcode with A8, address byte, 1 to 8 bytes</text>
<text x="82" y="821" font-size="15" font-weight="700" fill="#A7F3E6">Wait for the write cycle</text>
<text x="82" y="845.8" font-size="13" fill="#D2DAE4">Status every 100 us, up to write_timeout_us</text>
<text x="82" y="920" font-size="15" font-weight="700" fill="#A7F3E6">WEN must be 0 again</text>
<text x="82" y="944.8" font-size="13" fill="#D2DAE4">Still 1: the chip ignored the WRITE</text>
<text x="82" y="1019" font-size="15" font-weight="700" fill="#A7F3E6">Read the page back</text>
<text x="82" y="1043.8" font-size="13" fill="#D2DAE4">Only with Verify::ReadBack</text>
<text x="48" y="558.8" font-size="13" font-weight="700" fill="#A7F3E6">FOR EACH 8-BYTE PAGE</text>
<text x="48" y="576.2" font-size="12" fill="#A7F3E6">A WRITE never crosses a page: the address wraps inside it</text>
<text x="82" y="1128" font-size="15" font-weight="700" fill="#E2E8F0">Park WP</text>
<text x="82" y="1152.8" font-size="13" fill="#D2DAE4">After the last page or the first failure; WRDI after a failure</text>
<rect x="672" y="147.8" width="94.9" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="680" y="162.2" font-size="11.5" font-weight="700" fill="#FECDD3">NotInitialized</text>
<rect x="774.9" y="147.8" width="115.5" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="782.9" y="162.2" font-size="11.5" font-weight="700" fill="#FECDD3">InvalidArgument</text>
<rect x="672" y="246.8" width="72.6" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="680" y="261.2" font-size="11.5" font-weight="700" fill="#FECDD3">BusNoise</text>
