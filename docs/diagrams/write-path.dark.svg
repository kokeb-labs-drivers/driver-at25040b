<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1341" viewBox="0 0 1200 1341" role="img" aria-labelledby="write-path-title write-path-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="write-path-title">Write(), step by step</title>
<desc id="write-path-desc">Flowchart of Write: check the range, read the status until idle, refuse a block-protected range, release WP, then per 8-byte page WREN and a WEN check, WRITE, the write cycle wait, a WEN check and a read-back; WP is parked at the end, and each step names the error it can return.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1340" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">API GUIDE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">Write(), step by step</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One card per step. A pill names the error the step adds; every transfer can also fail with Bus.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
