<text x="680" y="459.2" font-size="11.5" font-weight="700" fill="#FECDD3">Pin</text>
<rect x="672" y="606.2" width="72.6" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="680" y="620.6" font-size="11.5" font-weight="700" fill="#FECDD3">BusNoise</text>
<rect x="752.6" y="606.2" width="107.3" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="760.6" y="620.6" font-size="11.5" font-weight="700" fill="#FECDD3">WriteProtected</text>
<rect x="672" y="804.2" width="65.4" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="680" y="818.6" font-size="11.5" font-weight="700" fill="#FECDD3">Timeout</text>
<rect x="672" y="903.2" width="107.6" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="680" y="917.6" font-size="11.5" font-weight="700" fill="#FECDD3">WriteMismatch</text>
<rect x="672" y="1002.2" width="107.6" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="680" y="1016.6" font-size="11.5" font-weight="700" fill="#FECDD3">WriteMismatch</text>
<rect x="672" y="1111.2" width="34.8" height="21.5" rx="10.8" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<text x="680" y="1125.6" font-size="11.5" font-weight="700" fill="#FECDD3">Pin</text>
<text x="46" y="1227" font-size="15" font-weight="700" fill="#E2E8F0">After a failure</text>
<text x="46" y="1244.8" font-size="13" fill="#E2E8F0">A failed call has written the pages before the failing one (and verified them); the failing page may hold old, new or partly written data; nothing after it and nothing outside</text>
<text x="46" y="1263.6" font-size="13" fill="#E2E8F0">the range changes.</text>
<rect x="32" y="1294.9" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="54" y="1306.5" font-size="12.5" fill="#9AA6B5">once per call</text>
<rect x="158.8" y="1294.9" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="180.8" y="1306.5" font-size="12.5" fill="#9AA6B5">once per page</text>
<rect x="295.5" y="1294.9" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="317.5" y="1306.5" font-size="12.5" fill="#9AA6B5">error this step adds</text>
<path d="M463.5 1301.2L493.5 1301.2" fill="none" stroke="#6C7889" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="507.5" y="1306.5" font-size="12.5" fill="#9AA6B5">next step</text>
</svg>
