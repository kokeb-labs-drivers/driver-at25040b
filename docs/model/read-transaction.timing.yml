---
kind: timing
id: read-transaction
title: READ instruction
kicker: On the bus
alt: >-
  One READ instruction of the AT25040B: CS low, the opcode with address bit A8, the low address byte on SI, then
  data bytes on SO from that address onwards until CS rises.
reads: >-
  The three lanes are CS, SI and SO, left to right in time, one field per byte. While CS is low the host sends on SI
  the opcode 0000 A011, whose bit 3 is address bit A8, and the address bits A7 to A0; the chip then sends on SO the
  byte at that address and the next ones. SO stays high impedance until the data and again after CS rises.
bus: transaction
