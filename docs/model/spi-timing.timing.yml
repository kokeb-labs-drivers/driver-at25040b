---
kind: timing
id: spi-timing
title: SPI timing
kicker: On the bus
alt: >-
  SPI timing of the AT25040B in mode 0: CS low frames the transfer, SI is read on each rising SCK edge and SO changes
  after each falling edge, most significant bit first, with the Table 4-3 times for a 1.8 V to 5.5 V supply.
reads: >-
  The four lanes are CS, SCK, SI and SO, left to right in time. CS goes low, SCK idles low, the chip reads SI on the
  rising edge and drives SO after the falling edge, from bit 7 to bit 0; bits 4 and 3 are left out, and SO returns
  to high impedance after CS rises. The table gives each interval for the full supply range and the clock limit of
  each supply range.
bus: spi
mode: {cpol: 0, cpha: 0}
refs:
  ac: {doc: ds, section: "4.3 AC Characteristics, Table 4-3", page: 5}
  ac6: {doc: ds, section: "4.3 AC Characteristics, Table 4-3 (continued)", page: 6}
  serial: {doc: ds, section: "5 Serial Interface Description", page: 6}
  features: {doc: ds, section: "Features; Description", page: 1}
