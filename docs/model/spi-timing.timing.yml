  - {id: sck, label: SCK, wave: "0..nnn|nnn0..", clock: true}
  - {id: si, label: SI, wave: "x..===|===x..", data: [b7, b6, b5, b2, b1, b0]}
  - {id: so, label: SO, wave: "z..===|===.z.", data: [b7, b6, b5, b2, b1, b0], tone: teal}
groups:
