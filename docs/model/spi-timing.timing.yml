  - {id: tcs, symbol: tCS, label: "CS high time between transfers (100 ns from 2.5 V)", min: 200, unit: ns, ref: ac}
  - {id: twh, symbol: tWH, label: "SCK high time (40 ns from 2.5 V, 20 ns from 4.5 V)", min: 80, unit: ns, ref: ac}
