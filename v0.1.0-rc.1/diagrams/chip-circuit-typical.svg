<svg xmlns="http://www.w3.org/2000/svg" width="920" height="661" viewBox="0 0 920 661" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">AT25040B: Typical wiring</title>
<desc id="chip-circuit-typical-desc">Schematic of the AT25040B typical wiring: the chip with U2 MCU, C1 capacitor 100 nF, R1 resistor 10 kΩ; the MCU wires carry the port hooks GpioSet(CtrlPin::WriteProtect), Transfer().</desc>
<rect x="0.5" y="0.5" width="919" height="660" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">AT25040B: Typical wiring</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The EEPROM on an MCU's SPI bus as Figure 5-1 draws it (MOSI to SI, MISO from SO, SCK, a select line to CS),</text>
<text x="32" y="125.5" font-size="15" fill="#566070">with WP on a GPIO the driver drives through GpioSet() and HOLD tied to VCC. Above each MCU wire: the port</text>
<text x="32" y="147.3" font-size="15" fill="#566070">hook that drives it. Datasheet: 5 Serial Interface Description, Figure 5-1, p. 7.</text>
