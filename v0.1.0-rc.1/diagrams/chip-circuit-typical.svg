<text x="32" y="578.3" font-size="12.5" fill="#566070">* Not confirmed in the datasheet: C1 100 nF: decoupling value: the datasheet gives no VCC decoupling; R1 10 kΩ: board choice that</text>
<text x="32" y="596.3" font-size="12.5" fill="#566070">keeps WP low (writes blocked) until the MCU drives it; the datasheet shows no WP circuit.</text>
