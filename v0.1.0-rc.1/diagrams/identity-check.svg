<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812" viewBox="0 0 1200 812" role="img" aria-labelledby="identity-check-title identity-check-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="identity-check-title">The identity check, and what a broken bus looks like</title>
<desc id="identity-check-desc">Left: the steps of EnsureInitialized, the status read until idle and confirmed, the write enable toggle or the double read of the first bytes, each with its errors. Right: each bus fault from the tests with the status byte it shows and the error it returns.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="811" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">CONTRACT</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">The identity check, and what a broken bus looks like</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Left: what EnsureInitialized() does. Right: the faults the tests inject, and what the driver says.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
<path d="M455.2 210.8 L455.2 266.3" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M455.2 343.3 L455.2 398.8" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M496 304.8 L584 304.8 Q592 304.8 592 312.8 L592 561.8 Q592 569.8 584 569.8 L496 569.8" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="137.8" width="460" height="69" rx="10" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="145.8" width="4" height="53" rx="2" fill="#9A4A17"/>
<rect x="32" y="270.3" width="460" height="69" rx="10" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="278.3" width="4" height="53" rx="2" fill="#9A4A17"/>
<rect x="32" y="402.8" width="460" height="69" rx="10" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
