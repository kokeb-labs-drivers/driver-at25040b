<rect x="32" y="535.3" width="460" height="69" rx="10" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="543.3" width="4" height="53" rx="2" fill="#9A4A17"/>
<rect x="702" y="137.8" width="466" height="69" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="702" y="145.8" width="4" height="53" rx="2" fill="#C26A05"/>
<rect x="702" y="222.8" width="466" height="69" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="702" y="230.8" width="4" height="53" rx="2" fill="#C26A05"/>
<rect x="702" y="307.8" width="466" height="69" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="702" y="315.8" width="4" height="53" rx="2" fill="#C26A05"/>
<rect x="702" y="392.8" width="466" height="69" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="702" y="400.8" width="4" height="53" rx="2" fill="#C26A05"/>
<rect x="702" y="477.8" width="466" height="69" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="702" y="485.8" width="4" height="53" rx="2" fill="#C26A05"/>
<rect x="32" y="671.8" width="1136" height="79.3" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#7A360E">Check the Config, bring the bus up, park WP</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">No transfer before Validate() passes</text>
<rect x="32" y="214.8" width="115.5" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="40" y="229.2" font-size="11.5" font-weight="700" fill="#9F1239">InvalidArgument</text>
<text x="52" y="297.1" font-size="15" font-weight="700" fill="#7A360E">(a) Status until idle, confirmed</text>
<text x="52" y="321.9" font-size="13" fill="#2B3442">0xFF waits; bits 7 to 4 or RDY set: not a status</text>
<rect x="32" y="347.3" width="72.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="40" y="361.7" font-size="11.5" font-weight="700" fill="#9F1239">BusNoise</text>
<rect x="112.6" y="347.3" width="127.1" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="120.6" y="361.7" font-size="11.5" font-weight="700" fill="#9F1239">DeviceIdMismatch</text>
<rect x="247.8" y="347.3" width="73.9" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="255.8" y="361.7" font-size="11.5" font-weight="700" fill="#9F1239">NoDevice</text>
<text x="52" y="429.6" font-size="15" font-weight="700" fill="#7A360E">(b) WEN must follow WREN and WRDI</text>
<text x="52" y="454.4" font-size="13" fill="#2B3442">WP released for it, parked after; nothing written</text>
<rect x="32" y="479.8" width="127.1" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="40" y="494.2" font-size="11.5" font-weight="700" fill="#9F1239">DeviceIdMismatch</text>
<rect x="167.1" y="479.8" width="72.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="175.1" y="494.2" font-size="11.5" font-weight="700" fill="#9F1239">BusNoise</text>
<text x="52" y="562" font-size="15" font-weight="700" fill="#7A360E">or: the first 8 bytes, twice</text>
<text x="52" y="586.9" font-size="13" fill="#2B3442">Only with check_write_enable = false (WP tied low)</text>
<rect x="32" y="612.3" width="72.6" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="40" y="626.7" font-size="11.5" font-weight="700" fill="#9F1239">BusNoise</text>
<rect x="515.6" y="427.3" width="152.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="592" y="441.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">check_write_enable off</text>
<text x="722" y="164.6" font-size="15" font-weight="700" fill="#8A3C0B">MISO floating high: module unplugged</text>
<text x="722" y="189.4" font-size="13" fill="#2B3442">Status 0xFF for the whole timeout</text>
<rect x="1082.1" y="177.3" width="73.9" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="1090.1" y="191.7" font-size="11.5" font-weight="700" fill="#9F1239">NoDevice</text>
<text x="722" y="249.6" font-size="15" font-weight="700" fill="#8A3C0B">MISO stuck low or pulled low</text>
<text x="722" y="274.4" font-size="13" fill="#2B3442">Status 0x00, but WEN never reads 1</text>
<rect x="1028.9" y="262.3" width="127.1" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="1036.9" y="276.7" font-size="11.5" font-weight="700" fill="#9F1239">DeviceIdMismatch</text>
<text x="722" y="334.6" font-size="15" font-weight="700" fill="#8A3C0B">MOSI echoed on MISO</text>
<text x="722" y="359.4" font-size="13" fill="#2B3442">Status 0x05, the RDSR opcode: RDY set</text>
<rect x="1028.9" y="347.3" width="127.1" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="1036.9" y="361.7" font-size="11.5" font-weight="700" fill="#9F1239">DeviceIdMismatch</text>
<text x="722" y="419.6" font-size="15" font-weight="700" fill="#8A3C0B">HOLD strapped to CS</text>
<text x="722" y="444.4" font-size="13" fill="#2B3442">SO stays high impedance: status 0xFF</text>
<rect x="1082.1" y="432.3" width="73.9" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="1090.1" y="446.7" font-size="11.5" font-weight="700" fill="#9F1239">NoDevice</text>
<text x="722" y="504.6" font-size="15" font-weight="700" fill="#8A3C0B">WP held low on the board</text>
<text x="722" y="529.4" font-size="13" fill="#2B3442">Status 0x00, WREN ignored: WEN stays 0</text>
<rect x="1028.9" y="517.3" width="127.1" height="21.5" rx="10.8" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<text x="1036.9" y="531.7" font-size="11.5" font-weight="700" fill="#9F1239">DeviceIdMismatch</text>
<text x="46" y="698.5" font-size="15" font-weight="700" fill="#8A3C0B">Why the toggle</text>
<text x="46" y="716.3" font-size="13" fill="#8A3C0B">A floating-low MISO reads status 0x00, which an idle chip also returns: only the write enable toggle tells them apart, which is why it is the default. With</text>
<text x="46" y="735.2" font-size="13" fill="#8A3C0B">check_write_enable off, a dead bus passes.</text>
<rect x="32" y="766.5" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="54" y="778.2" font-size="12.5" fill="#566070">start-up step</text>
<rect x="159" y="766.5" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="181" y="778.2" font-size="12.5" fill="#566070">fault on the bus or board</text>
<rect x="359.5" y="766.5" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="381.5" y="778.2" font-size="12.5" fill="#566070">error returned</text>
<path d="M493.4 772.8L523.4 772.8" fill="none" stroke="#8893A2" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="537.4" y="778.2" font-size="12.5" fill="#566070">next step</text>
</svg>
